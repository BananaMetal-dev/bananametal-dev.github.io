<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prompt Manager | Banana Metal</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <h1 id="appTitle"></h1>
        <p id="appLead"></p>
      </div>
      <div class="top-actions">
        <div class="language-toggle" aria-label="Language">
          <button id="languageJaButton" class="language-toggle-button" type="button">日本語</button>
          <button id="languageEnButton" class="language-toggle-button" type="button">English</button>
        </div>
        <a id="backToAppsLink" class="app-back-link" href="/apps/"></a>
        <span id="saveStatus" class="save-status" aria-live="polite"></span>
        <label class="edit-toggle">
          <input id="editModeToggle" type="checkbox">
          <span class="toggle-track" aria-hidden="true"></span>
          <span id="editModeLabel" class="toggle-text"></span>
        </label>
      </div>
    </header>

    <nav class="sheet-bar" aria-label="Sheets">
      <div id="sheetTabs" class="sheet-tabs"></div>
      <button id="addSheetButton" class="icon-button" type="button">+</button>
    </nav>

    <section class="local-note" aria-label="Storage note">
      <p id="localNoteText"></p>
    </section>

    <main class="content-layout">
      <section class="output-panel" aria-label="Output area">
        <div class="output-header">
          <div>
            <div class="output-heading-row">
              <h2 id="outputAreaTitle"></h2>
              <div class="output-actions">
                <button id="copyButton" type="button" class="primary-button"></button>
                <button id="resetButton" type="button" class="secondary-button"></button>
              </div>
              <label class="join-mode-toggle" for="outputJoinModeToggle">
                <span id="joinModeLabel" class="join-mode-label"></span>
                <input id="outputJoinModeToggle" type="checkbox" checked>
                <span class="toggle-track" aria-hidden="true"></span>
                <span id="outputJoinModeText" class="toggle-text"></span>
              </label>
            </div>
            <p id="outputSummary"></p>
          </div>
        </div>
        <textarea id="outputText" readonly spellcheck="false" aria-label="Generated prompt"></textarea>
      </section>

      <section class="sheet-manager-panel" aria-label="Sheet manager">
        <div class="board-toolbar">
          <div>
            <h2 id="sheetManagerTitle"></h2>
            <p id="sheetManagerLead"></p>
          </div>
          <button id="editAddSheetButton" class="icon-button" type="button">+</button>
        </div>
        <div id="editSheetTabs" class="sheet-manager-tabs"></div>
        <div class="sheet-manager-actions">
          <button id="editRenameSheetButton" type="button" class="secondary-button"></button>
          <button id="editDeleteSheetButton" type="button" class="danger-button"></button>
        </div>
        <label class="theme-toggle" for="steampunkThemeToggle">
          <span id="themeToggleLabel" class="theme-toggle-label"></span>
          <input id="steampunkThemeToggle" type="checkbox">
          <span class="toggle-track" aria-hidden="true"></span>
          <span id="themeToggleText" class="toggle-text">OFF</span>
        </label>
        <p id="sheetDragNote" class="small-note"></p>
      </section>

      <div
        id="outputResizeHandle"
        class="column-resizer"
        role="separator"
        aria-label="Resize output and button areas"
        aria-orientation="vertical"
        tabindex="0"
      ></div>

      <div class="right-column">
        <div class="workspace">
          <section class="board-panel" aria-label="Prompt board">
            <div class="board-toolbar">
              <div>
                <h2 id="activeSheetTitle">共通</h2>
                <p id="boardHint"></p>
              </div>
              <div class="grid-controls edit-only">
                <label><span id="columnsLabel"></span>
                  <input id="columnsInput" type="number" min="1" max="20" inputmode="numeric">
                </label>
                <span class="multiply">x</span>
                <label><span id="rowsLabel"></span>
                  <input id="rowsInput" type="number" min="1" max="20" inputmode="numeric">
                </label>
              </div>
            </div>
            <div id="gridScroller" class="grid-scroller grid-viewport-scroller">
              <div id="promptGrid" class="prompt-grid"></div>
            </div>
          </section>

          <aside id="editPanel" class="edit-panel" aria-label="Edit panel">
            <section class="panel-section sheet-management-section">
              <h2 id="editSheetTitle"></h2>
              <div class="button-row">
                <button id="renameSheetButton" type="button" class="secondary-button"></button>
                <button id="deleteSheetButton" type="button" class="danger-button"></button>
              </div>
              <p id="editSheetNote" class="small-note"></p>
            </section>

            <section class="panel-section">
              <h2 id="promptAssignTitle"></h2>
              <div id="buttonEditorEmpty" class="empty-editor"></div>
              <div id="buttonEditor" class="button-editor" hidden>
                <div class="assignment-target">
                  <span id="selectedLabel"></span>
                  <strong id="selectedButtonLabel"></strong>
                </div>
                <label id="buttonPromptLabel" class="field-label primary-field-label" for="buttonPromptInput"></label>
                <textarea id="buttonPromptInput" class="paste-field" rows="11"></textarea>
                <label id="buttonNameLabel" class="field-label" for="buttonNameInput"></label>
                <input id="buttonNameInput" type="text" maxlength="80">
                <label class="check-row">
                  <input id="buttonEnabledInput" type="checkbox">
                  <span id="buttonEnableLabel"></span>
                </label>
                <button id="deleteButtonButton" type="button" class="danger-button full-width"></button>
              </div>
            </section>

            <section class="panel-section">
              <h2 id="dataTitle"></h2>
              <div class="button-row">
                <button id="exportButton" type="button" class="secondary-button"></button>
                <button id="importButton" type="button" class="secondary-button"></button>
              </div>
              <input id="importFileInput" type="file" accept="application/json,.json" hidden>
            </section>
          </aside>
        </div>

        <section class="quick-copy-panel" aria-label="Single copy button area">
          <div class="board-toolbar">
            <div>
              <h2 id="singleCopyTitle"></h2>
              <p id="copyBoardHint"></p>
            </div>
            <div class="grid-controls edit-only">
              <label><span id="copyColumnsLabel"></span>
                <input id="copyColumnsInput" type="number" min="1" max="20" inputmode="numeric">
              </label>
              <span class="multiply">x</span>
              <label><span id="copyRowsLabel"></span>
                <input id="copyRowsInput" type="number" min="1" max="20" inputmode="numeric">
              </label>
            </div>
          </div>
          <div id="copyGridScroller" class="grid-scroller grid-viewport-scroller">
            <div id="copyPromptGrid" class="prompt-grid"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/shared-language.js"></script>
  <script src="app.js"></script>
</body>
</html>
